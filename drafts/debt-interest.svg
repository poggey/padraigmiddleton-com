<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="t">Debt interest as a share of GDP, 2019-20 to 2031-32</title>
<desc id="d">Line chart of central government debt interest, net of the APF, as a percentage of GDP. It falls from 1.7% in 2019-20 to 1.2% in 2020-21, jumps to a peak of 4.2% in 2022-23, eases to 3.5% in 2025-26, and is forecast by the OBR to rise again to 4.2% by 2031-32.</desc>
