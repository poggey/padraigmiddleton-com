.surface{fill:#1a1a19}.ink{fill:#f0efec}.ink2{fill:#c3c2b7}
.grid{stroke:#2c2c2a}.base{stroke:#383835}.band{fill:#232322}
.line{stroke:#3987e5}.dot{fill:#3987e5;stroke:#1a1a19}.wash{fill:#3987e5}}
text{font-variant-numeric:tabular-nums}
</style>
