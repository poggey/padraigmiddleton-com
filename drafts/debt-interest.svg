.surface{fill:#fcfcfb}.ink{fill:#0b0b0b}.ink2{fill:#52514e}.muted{fill:#898781}
.grid{stroke:#e1e0d9}.base{stroke:#c3c2b7}.band{fill:#f0efec}
.line{stroke:#2a78d6}.dot{fill:#2a78d6;stroke:#fcfcfb}.wash{fill:#2a78d6;fill-opacity:.1}
